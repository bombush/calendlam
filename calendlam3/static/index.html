<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendlam</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: Arial, sans-serif; background: #e5e7eb; }
    .toolbar { display: flex; align-items: center; gap: 1.25rem; padding: .6rem 1rem; background: #1f2937; color: #fff; }
    .toolbar h1 { font-size: 1.1rem; margin: 0 auto 0 0; }
    .toolbar input[type=number] { width: 5rem; padding: .25rem; }
    .print-btn { padding: .45rem 1.2rem; background: #2563eb; color: #fff; border: 0; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .print-btn:disabled { opacity: .5; cursor: default; }
    .toolbar.sub { padding: .35rem 1rem; background: #374151; font-size: .9rem; }
    .toolbar.sub .val { display: inline-block; width: 2.5rem; }
    iframe { flex: 1; width: 100%; border: 0; }
  </style>
  <!-- all picker fonts, so the dropdown can preview them -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Rubik&family=Open+Sans&family=Bebas+Neue&family=Oswald&family=Roboto+Slab&family=Playfair+Display&family=Abril+Fatface&family=Cinzel&family=Lobster&family=Pacifico&family=Caveat&family=Permanent+Marker&family=Shadows+Into+Light&family=Special+Elite&family=Righteous&family=Bungee&family=Orbitron&family=Press+Start+2P&family=Monoton&family=Fredericka+the+Great&display=swap">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="calendar()" x-init="$watch('zoom', applyZoom)">
  <header class="toolbar">
    <h1>Calendlam</h1>
    <label>Year <input type="number" x-model.number="year" min="1" max="9999" @change="reload()"></label>
    <label>Sheets/signature <input type="number" x-model.number="sheets" min="1" max="50" @change="reload()"></label>
    <template x-for="p in pickers" :key="p.key">
      <label><span x-text="p.label"></span>
        <select x-model="p.value" @change="reload()" :style="`font-family: '${p.value}'`">
          <template x-for="f in fonts" :key="f"><option :value="f" :style="`font-family: '${f}'`" x-text="f"></option></template>
        </select>
      </label>
    </template>
    <label>Zoom
      <input type="range" min="0.3" max="1.5" step="0.05" x-model.number="zoom">
      <span x-text="Math.round(zoom * 100) + '%'"></span>
    </label>
    <button class="print-btn" @click="print()" :disabled="!loaded">Print</button>
  </header>
  <div class="toolbar sub">
    <span>Lines (mm)</span>
    <template x-for="l in lines" :key="l.key">
      <label><span x-text="l.label"></span>
        <select x-model="l.style" @change="applyLines()">
          <template x-for="st in lineStyles" :key="st"><option :value="st" x-text="st"></option></template>
        </select>
        <input type="range" min="0" max="1" step="0.05" x-model.number="l.value" @input="applyLines()">
        <span class="val" x-text="l.value.toFixed(2)"></span>
      </label>
    </template>
  </div>

  <!-- the preview subwindow: scrolls on its own -->
  <iframe x-ref="frame" :src="src" @load="loaded = true; applyZoom(); applyLines()" title="Calendar preview"></iframe>

  <script>
    function calendar() {
      return {
        year: 2026, sheets: 5, zoom: 0.8, loaded: false, fonts: [],
        pickers: [
          { key: 'number_font', label: 'Number font', value: 'Cinzel' },
          { key: 'day_font', label: 'Day font', value: 'Rubik' },
          { key: 'month_font', label: 'Month font', value: 'Rubik' },
        ],
        lineStyles: ['solid', 'dotted', 'dashed', 'none'],
        lines: [
          { key: 'row', label: 'Day', value: 0.5, style: 'solid' },
          { key: 'q1', label: '1/4', value: 0.05, style: 'dotted' },
          { key: 'mid', label: 'Middle', value: 0.1, style: 'dotted' },
          { key: 'q3', label: '3/4', value: 0.05, style: 'dotted' },
        ],
        src: '/render?year=2026&sheets=5&number_font=Cinzel&day_font=Rubik&month_font=Rubik',
        async init() { this.fonts = await (await fetch('/api/fonts')).json(); },
        reload() { this.loaded = false; const fonts = this.pickers.map(p => `&${p.key}=${encodeURIComponent(p.value)}`).join('')
            + this.lines.map(l => `&line_${l.key}=${l.value}&style_${l.key}=${l.style}`).join('');
          this.src = `/render?year=${this.year}&sheets=${this.sheets}${fonts}&_=${Date.now()}`; },
        applyLines() { // live update, no reload; also survives printing
          const doc = this.$refs.frame.contentDocument;
          if (doc && doc.documentElement) this.lines.forEach(l => {
            doc.documentElement.style.setProperty(`--line-${l.key}`, l.value + 'mm');
            doc.documentElement.style.setProperty(`--line-${l.key}-style`, l.style);
          });
        },
        applyZoom() {
          const doc = this.$refs.frame.contentDocument;
          if (doc && doc.body) doc.body.style.zoom = this.zoom; // screen-only; print resets below
        },
        print() {
          const w = this.$refs.frame.contentWindow, body = w.document.body, z = body.style.zoom;
          body.style.zoom = 1;                       // print at true size regardless of preview zoom
          w.addEventListener('afterprint', () => { body.style.zoom = z; }, { once: true });
          w.focus(); w.print();
        },
      };
    }
  </script>
</body>
</html>
