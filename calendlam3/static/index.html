<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendlam</title>
  <style>
    * { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: Arial, sans-serif; background: #e5e7eb; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.25rem; padding: .6rem 1rem; background: #1f2937; color: #fff; }
    .toolbar h1 { font-size: 1.1rem; margin: 0 auto 0 0; }
    .toolbar input[type=number] { width: 5rem; padding: .25rem; }
    .save-btn { padding: .45rem 1rem; background: #059669; color: #fff; border: 0; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .msg { font-size: .85rem; opacity: .8; min-width: 6rem; }
    .print-btn { padding: .45rem 1.2rem; background: #2563eb; color: #fff; border: 0; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .print-btn:disabled { opacity: .5; cursor: default; }
    .toolbar.sub { padding: .35rem 1rem; background: #374151; font-size: .9rem; }
    .toolbar.sub .val { display: inline-block; width: 2.5rem; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal { background: #fff; color: #111; width: min(32rem, 92vw); border-radius: 8px; padding: 1.25rem 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    .modal h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
    .modal p { margin: 0 0 .75rem; color: #4b5563; font-size: .9rem; }
    .modal table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    .modal td { padding: .35rem .25rem; border-bottom: 1px solid #e5e7eb; }
    .modal td:first-child { color: #4b5563; width: 45%; }
    .modal td:last-child { font-weight: 600; }
    .modal .actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
    .modal button { padding: .45rem 1.2rem; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; font-size: 1rem; cursor: pointer; }
    .modal button.ok { background: #2563eb; color: #fff; border-color: #2563eb; }
    iframe { flex: 1; width: 100%; border: 0; }
  </style>
  <!-- all picker fonts, so the dropdown can preview them -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Rubik&family=Open+Sans&family=Bebas+Neue&family=Oswald&family=Roboto+Slab&family=Playfair+Display&family=Abril+Fatface&family=Cinzel&family=Lobster&family=Pacifico&family=Caveat&family=Permanent+Marker&family=Shadows+Into+Light&family=Special+Elite&family=Righteous&family=Bungee&family=Orbitron&family=Press+Start+2P&family=Monoton&family=Fredericka+the+Great&display=swap">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="calendar()" x-init="$watch('zoom', applyZoom)">
  <header class="toolbar">
    <h1>Calendlam</h1>
    <label>Year <input type="number" x-model.number="year" min="1" max="9999" @change="reload()"></label>
    <label>Sheets/signature <input type="number" x-model.number="sheets" min="1" max="50" @change="reload()"></label>
    <template x-for="p in pickers" :key="p.key">
      <label><span x-text="p.label"></span>
        <select x-model="p.value" @change="reload()" :style="`font-family: '${p.value}'`">
          <template x-for="f in fonts" :key="f"><option :value="f" :style="`font-family: '${f}'`" x-text="f"></option></template>
        </select>
      </label>
    </template>
    <label><input type="checkbox" x-model="showInfo" @change="reload()"> Page labels</label>
    <label>Zoom
      <input type="range" min="0.3" max="1.5" step="0.05" x-model.number="zoom">
      <span x-text="Math.round(zoom * 100) + '%'"></span>
    </label>
    <label>Settings
      <select x-model="selectedSave" @change="loadSave(selectedSave)">
        <option value="">— saved versions —</option>
        <template x-for="sv in saves" :key="sv.id"><option :value="sv.id" x-text="(sv.name || 'unnamed') + ' · ' + sv.saved_at.replace('T', ' ')"></option></template>
      </select>
    </label>
    <input type="text" x-model="saveName" placeholder="version name" maxlength="60" style="width: 9rem">
    <button class="save-btn" @click="save()">Save</button>
    <span class="msg" x-text="message"></span>
    <button class="print-btn" @click="showGuide = true" :disabled="!loaded">Print</button>
  </header>
  <div class="toolbar sub">
    <span>Lines (mm)</span>
    <template x-for="l in lines" :key="l.key">
      <label><span x-text="l.label"></span>
        <select x-model="l.style" @change="applyLines()">
          <template x-for="st in lineStyles" :key="st"><option :value="st" x-text="st"></option></template>
        </select>
        <input type="range" min="0" :max="l.max" step="0.05" x-model.number="l.value" @input="applyLines()">
        <span class="val" x-text="l.value.toFixed(2)"></span>
      </label>
    </template>
  </div>
  <div class="toolbar sub">
    <span>Layout (mm)</span>
    <template x-for="l in layout" :key="l.key">
      <label><span x-text="l.label"></span>
        <input type="range" :min="l.min ?? 0" :max="l.max" step="0.25" x-model.number="l.value" @input="applyLines()">
        <span class="val" x-text="l.value.toFixed(2)"></span>
      </label>
    </template>
  </div>

  <!-- print guide: shown before the browser's print dialog -->
  <div class="modal-backdrop" x-show="showGuide" x-cloak x-transition.opacity @keydown.escape.window="showGuide = false" @click.self="showGuide = false">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <h2 id="guide-title">Before you print</h2>
      <p>Choose these options in the print dialog that opens next:</p>
      <table>
        <tr><td>Paper size</td><td>A4</td></tr>
        <tr><td>Layout / Orientation</td><td>Landscape</td></tr>
        <tr><td>Scale</td><td>100% (not “Fit to page”)</td></tr>
        <tr><td>Margins</td><td>Default</td></tr>
        <tr><td>Two-sided</td><td>On</td></tr>
        <tr><td>Flip</td><td>Flip on short edge</td></tr>
        <tr><td>Headers and footers</td><td>Off</td></tr>
      </table>
      <div class="actions">
        <button @click="showGuide = false">Cancel</button>
        <button class="ok" x-ref="ok" @click="showGuide = false; print()">OK</button>
      </div>
    </div>
  </div>

  <!-- the preview subwindow: scrolls on its own -->
  <iframe x-ref="frame" :src="src" @load="if (src) { loaded = true; applyZoom(); applyLines() }" title="Calendar preview"></iframe>

  <script>
    function calendar() {
      return {
        year: 2026, sheets: 5, zoom: 0.8, showInfo: true, showGuide: false, loaded: false, fonts: [],
        pickers: [
          { key: 'number_font', label: 'Number font', value: 'Cinzel' },
          { key: 'day_font', label: 'Day font', value: 'Rubik' },
          { key: 'month_font', label: 'Month font', value: 'Rubik' },
        ],
        layout: [
          { key: 'row_height', css: '--layout-row-height', label: 'Day height', value: 24, min: 15, max: 26 },
          { key: 'margin_left', css: '--layout-margin-left', label: 'Left margin', value: 5, max: 20 },
          { key: 'extend_right', css: '--layout-extend-right', label: 'Stretch right (14.75 = to fold)', value: 14.75, max: 14.75 },
        ],
        lineStyles: ['solid', 'dotted', 'dashed', 'none'],
        lines: [
          { key: 'header', label: 'Header', value: 1, style: 'solid', max: 3 },
          { key: 'row', label: 'Day', value: 0.5, style: 'solid', max: 1 },
          { key: 'q1', label: '1/4', value: 0.05, style: 'dotted', max: 1 },
          { key: 'mid', label: 'Middle', value: 0.1, style: 'dotted', max: 1 },
          { key: 'q3', label: '3/4', value: 0.05, style: 'dotted', max: 1 },
        ],
        src: '', saves: [], selectedSave: '', saveName: '', message: '',
        async init() {
          this.fonts = await (await fetch('/api/fonts')).json();
          await this.refreshSaves();
          if (this.saves.length) await this.loadSave(this.saves[0].id);  // remember: start from the latest save
          else this.reload();
        },
        async refreshSaves() {
          try { this.saves = await (await fetch('/api/settings')).json(); } catch (e) { this.saves = []; }
        },
        snapshot() {
          return {
            year: this.year, sheets: this.sheets, zoom: this.zoom, showInfo: this.showInfo,
            fonts: Object.fromEntries(this.pickers.map(p => [p.key, p.value])),
            lines: Object.fromEntries(this.lines.map(l => [l.key, { value: l.value, style: l.style }])),
            layout: Object.fromEntries(this.layout.map(l => [l.key, l.value])),
          };
        },
        applySettings(st) {  // only known keys, validated, so old/odd saves can't break the page
          const num = (v, lo, hi, d) => (typeof v === 'number' && v >= lo && v <= hi) ? v : d;
          this.year = num(st.year, 1, 9999, this.year);
          this.sheets = num(st.sheets, 1, 50, this.sheets);
          this.zoom = num(st.zoom, 0.3, 1.5, this.zoom);
          if (typeof st.showInfo === 'boolean') this.showInfo = st.showInfo;
          this.pickers.forEach(p => { const f = (st.fonts || {})[p.key]; if (this.fonts.includes(f)) p.value = f; });
          this.layout.forEach(l => { l.value = num((st.layout || {})[l.key], l.min ?? 0, l.max, l.value); });
          this.lines.forEach(l => {
            const v = (st.lines || {})[l.key] || {};
            l.value = num(v.value, 0, l.max, l.value);
            if (this.lineStyles.includes(v.style)) l.style = v.style;
          });
        },
        async loadSave(id) {
          if (!id) return;
          try {
            const doc = await (await fetch(`/api/settings/${encodeURIComponent(id)}`)).json();
            this.applySettings(doc.settings || {});
            this.selectedSave = id; this.saveName = doc.name || '';
            this.message = 'Loaded'; this.reload();
          } catch (e) { this.message = 'Load failed'; this.reload(); }
        },
        async save() {
          try {
            const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: this.saveName, settings: this.snapshot() }) });
            if (!r.ok) throw new Error(r.status);
            const saved = await r.json();
            await this.refreshSaves();
            this.selectedSave = saved.id; this.message = 'Saved';
          } catch (e) { this.message = 'Save failed'; }
        },
        reload() { this.loaded = false; const fonts = this.pickers.map(p => `&${p.key}=${encodeURIComponent(p.value)}`).join('')
            + this.lines.map(l => `&line_${l.key}=${l.value}&style_${l.key}=${l.style}`).join('')
            + this.layout.map(l => `&${l.key}=${l.value}`).join('');
          this.src = `/render?year=${this.year}&sheets=${this.sheets}&info=${this.showInfo}${fonts}&_=${Date.now()}`; },
        applyLines() { // live update, no reload; also survives printing
          const doc = this.$refs.frame.contentDocument;
          if (doc && doc.documentElement) this.lines.forEach(l => {
            doc.documentElement.style.setProperty(`--line-${l.key}`, l.value + 'mm');
            doc.documentElement.style.setProperty(`--line-${l.key}-style`, l.style);
          });
          this.layout.forEach(l => doc.documentElement.style.setProperty(l.css, l.value + 'mm'));
        },
        applyZoom() {
          const doc = this.$refs.frame.contentDocument;
          if (doc && doc.body) doc.body.style.zoom = this.zoom; // screen-only; print resets below
        },
        print() {
          const w = this.$refs.frame.contentWindow, body = w.document.body, z = body.style.zoom;
          body.style.zoom = 1;                       // print at true size regardless of preview zoom
          w.addEventListener('afterprint', () => { body.style.zoom = z; }, { once: true });
          w.focus(); w.print();
        },
      };
    }
  </script>
</body>
</html>
